name: Android APK

on:
  push:
    branches: ["main"]
    tags: ["v*"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:
    inputs:
      build_release:
        description: "Zbuduj również release APK"
        required: true
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: android-apk-${{ github.ref }}
  cancel-in-progress: true

env:
  JAVA_VERSION: "17"
  GRADLE_VERSION: "9.6.0"
  ANDROID_API: "37"
  ANDROID_BUILD_TOOLS: "36.0.0"
  APP_VERSION: "0.8.1"

jobs:
  debug:
    name: Build debug APK
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4

      - name: Install Android SDK packages
        shell: bash
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager \
            "platform-tools" \
            "platforms;android-${ANDROID_API}" \
            "build-tools;${ANDROID_BUILD_TOOLS}"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: ${{ env.GRADLE_VERSION }}
          cache-provider: basic

      - name: Prepare Gradle Wrapper
        shell: bash
        run: |
          if [[ ! -f gradle/wrapper/gradle-wrapper.jar ]]; then
            gradle wrapper --gradle-version "${GRADLE_VERSION}" --distribution-type bin
          fi
          chmod +x gradlew
          ./gradlew --version

      - name: Build debug APK
        run: ./gradlew --no-daemon --stacktrace :app:assembleDebug

      - name: Prepare debug artifact
        shell: bash
        run: |
          mkdir -p dist
          cp app/build/outputs/apk/debug/app-debug.apk "dist/CRM-Mobile-Bridge-${APP_VERSION}-debug.apk"
          sha256sum "dist/CRM-Mobile-Bridge-${APP_VERSION}-debug.apk" > "dist/CRM-Mobile-Bridge-${APP_VERSION}-debug.apk.sha256"

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: CRM-Mobile-Bridge-${{ env.APP_VERSION }}-debug
          path: dist/*debug.apk*
          if-no-files-found: error
          retention-days: 30

  release:
    name: Build release APK
    if: startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && inputs.build_release == true)
    runs-on: ubuntu-latest
    timeout-minutes: 30

    env:
      ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
      ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
      ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
      ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4

      - name: Install Android SDK packages
        shell: bash
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager \
            "platform-tools" \
            "platforms;android-${ANDROID_API}" \
            "build-tools;${ANDROID_BUILD_TOOLS}"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: ${{ env.GRADLE_VERSION }}
          cache-provider: basic

      - name: Prepare Gradle Wrapper
        shell: bash
        run: |
          if [[ ! -f gradle/wrapper/gradle-wrapper.jar ]]; then
            gradle wrapper --gradle-version "${GRADLE_VERSION}" --distribution-type bin
          fi
          chmod +x gradlew
          ./gradlew --version

      - name: Prepare release signing
        id: signing
        shell: bash
        run: |
          if [[ -n "${ANDROID_KEYSTORE_BASE64}" && -n "${ANDROID_KEYSTORE_PASSWORD}" && -n "${ANDROID_KEY_ALIAS}" && -n "${ANDROID_KEY_PASSWORD}" ]]; then
            KEYSTORE_PATH="${RUNNER_TEMP}/crm-mobile-bridge-release.jks"
            printf '%s' "${ANDROID_KEYSTORE_BASE64}" | base64 --decode > "${KEYSTORE_PATH}"
            echo "ANDROID_KEYSTORE_PATH=${KEYSTORE_PATH}" >> "$GITHUB_ENV"
            echo "signed=true" >> "$GITHUB_OUTPUT"
          else
            echo "signed=false" >> "$GITHUB_OUTPUT"
            echo "Release signing secrets are incomplete. An unsigned release APK will be built."
          fi

      - name: Build release APK
        run: ./gradlew --no-daemon --stacktrace :app:assembleRelease

      - name: Prepare release artifact
        shell: bash
        run: |
          mkdir -p dist
          if [[ "${{ steps.signing.outputs.signed }}" == "true" ]]; then
            SOURCE="app/build/outputs/apk/release/app-release.apk"
            TARGET="dist/CRM-Mobile-Bridge-${APP_VERSION}-release-signed.apk"
          else
            SOURCE="app/build/outputs/apk/release/app-release-unsigned.apk"
            TARGET="dist/CRM-Mobile-Bridge-${APP_VERSION}-release-unsigned.apk"
          fi
          test -f "$SOURCE"
          cp "$SOURCE" "$TARGET"
          sha256sum "$TARGET" > "${TARGET}.sha256"

      - name: Upload release APK
        uses: actions/upload-artifact@v4
        with:
          name: CRM-Mobile-Bridge-${{ env.APP_VERSION }}-release
          path: dist/*release*.apk*
          if-no-files-found: error
          retention-days: 90
